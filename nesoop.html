<h1><b><u>ITERATIVE CONTOL STRUCTURE<br>(NESTED LOOPS)</u></b></h1>
<h3>Q1
Write a program print the pattern on the screen i.e. ?
11111
11111
11111
Answer:
void main()
{
int i,j;
for(i=0;i<3;i++)
{
for(j=0;j<5;j++)
{
printf("1");
}
printf("\n");
}
}
